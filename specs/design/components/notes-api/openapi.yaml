openapi: 3.0.3
info:
  title: Notes API
  version: 0.1.0
servers:
  - url: /
paths:
  /notes:
    get:
      operationId: listNotes
      summary: "Every note on the board, newest first"
      security:
        - oauth2: [notes:read-all]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: "A page of notes, newest first"
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: "total notes on the board" }
                  next: { type: string, nullable: true, description: "relative URI of the next page" }
                  previous: { type: string, nullable: true, description: "relative URI of the previous page" }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Note' }
        '401':
          description: "Not signed in or not permitted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: postNote
      summary: "Post a note as the signed-in team member"
      security:
        - oauth2: [notes:post]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewNote' }
      responses:
        '201':
          description: "The note was posted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400':
          description: "The note is empty or longer than 280 characters"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: "Not signed in or not permitted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            notes:read-all: See every note on the board
            notes:post: Post a new note
  schemas:
    NewNote:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 280
          description: "Plain text; spaces-only counts as empty"
    Note:
      type: object
      required: [id, body, authorId, authorName, createdAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, description: "Plain text, 1 to 280 characters" }
        authorId: { type: string, description: "Id of the team member who posted it" }
        authorName: { type: string, description: "Display name of the author when posted" }
        createdAt: { type: string, format: date-time, description: "When the note was posted" }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: "HTTP or application error code" }
        message: { type: string, description: "short human-readable label" }
        description: { type: string, description: "detailed explanation" }
        moreInfo: { type: string, description: "URI to documentation" }
security:
  - oauth2: []
